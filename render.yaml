# Render Blueprint for the voice agent worker, run as a free-tier Web Service.
#
# NB: The process behind this is a LiveKit Agents worker, not a web app. It
# binds a small HTTP health server on 0.0.0.0:$PORT (see src/agent.py
# build_server()) so Render's health check at "/" can keep it alive, and it
# separately dials OUT to LiveKit Cloud to register as agent "my-agent".
#
# No secret values live here. Values are set via the Render dashboard or API
# and stored there; `sync: false` keeps them out of this file and out of git.
services:
  - type: web_service
    name: my-voice-agent-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # --- LiveKit Cloud connection (required) ---
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # --- Model providers (required; src/agent.py fails fast without these) ---
      # Groq supplies STT (whisper-large-v3-turbo), LLM (qwen3.8-27b),
      # and the TTS fallback (Orpheus).
      - key: GROQ_API_KEY
        sync: false
      # Cartesia is the primary TTS.
      - key: CARTESIA_API_KEY
        sync: false
      # Anam drives the avatar. Optional: the agent degrades to
      # voice+text only if the avatar fails to start.
      - key: ANAM_API_KEY
        sync: false

      # --- Optional avatar overrides (defaults exist in src/agent.py) ---
      - key: ANAM_AVATAR_NAME
        sync: false
      - key: ANAM_AVATAR_ID
        sync: false